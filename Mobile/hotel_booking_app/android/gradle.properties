org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode=false
# AGP 9.x uvodi built-in Kotlin podrsku i novi DSL (android.newDsl=true je default), sa kojim
# eksplicitni plugin "org.jetbrains.kotlin.android" vise nije kompatibilan (vidi migracioni vodic:
# https://developer.android.com/build/migrate-to-built-in-kotlin). Projekat i dalje eksplicitno
# primjenjuje kotlin-android plugin (app/build.gradle), pa privremeno gasimo OBA flaga da izbjegnemo
# dodatnu migraciju uz veliki AGP 8->9 skok. android.builtInKotlin=false sam po sebi NIJE dovoljan —
# potrebno je i android.newDsl=false, inace Gradle puca sa ClassCastException pri primjeni
# kotlin-android plugina. Ovaj opt-out radi samo do AGP 10.0 — kad se pređe na AGP 10, ukloniti ove
# dvije linije i pratiti migracioni vodic (ukloniti kotlin-android plugin, koristiti built-in Kotlin).
android.builtInKotlin=false
android.newDsl=false
