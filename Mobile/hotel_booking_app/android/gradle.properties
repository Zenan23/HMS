org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode=false
# AGP 9.x uvodi built-in Kotlin podrsku i ocekuje da se plugin "org.jetbrains.kotlin.android"
# vise ne primjenjuje eksplicitno (vidi migracioni vodic: https://developer.android.com/build/migrate-to-built-in-kotlin).
# Projekat i dalje eksplicitno primjenjuje kotlin-android plugin (app/build.gradle), pa privremeno
# gasimo built-in Kotlin da izbjegnemo dodatnu migraciju uz veliki AGP 8->9 skok. Ovaj opt-out radi
# samo do AGP 10.0 — kad se pređe na AGP 10, treba ukloniti ovu liniju i pratiti migracioni vodic.
android.builtInKotlin=false
