services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
      cache_from:
        - mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: ebooking-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd!}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ebooking-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  api:
    build:
      context: ./backend/eBooking    
      dockerfile: Dockerfile
      cache_from:
        - mcr.microsoft.com/dotnet/sdk:8.0
        - mcr.microsoft.com/dotnet/aspnet:8.0
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: ebooking-api
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=IB170028;User ID=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd!};Encrypt=true;TrustServerCertificate=true;MultipleActiveResultSets=true
      - JWT__SecretKey=${JWT_SECRET:-ChangeThisToAStrongSecretKey_AtLeast32Chars}
      - JWT__Issuer=eBooking
      - JWT__Audience=eBookingUsers
      - Rabbit__Host=rabbitmq
      - Rabbit__User=${RABBIT_USER:-guest}
      - Rabbit__Pass=${RABBIT_PASS:-guest}
      # Payments (Stripe / PayPal) – vrijednosti iz .env ili shell okruženja; vidi .env.example
      - Payments__UseHostedCheckout=${PAYMENTS_USE_HOSTED_CHECKOUT:-true}
      - Payments__EnableNativeCheckout=${PAYMENTS_ENABLE_NATIVE_CHECKOUT:-true}
      - Payments__SkipPayPalWebhookVerification=${PAYMENTS_SKIP_PAYPAL_WEBHOOK_VERIFICATION:-false}
      - Payments__Stripe__SecretKey=${STRIPE_SECRET_KEY:-}
      - Payments__Stripe__PublishableKey=${STRIPE_PUBLISHABLE_KEY:-}
      - Payments__Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET:-}
      - Payments__Stripe__SuccessUrl=${STRIPE_SUCCESS_URL:-ebooking://payment-return}
      - Payments__Stripe__CancelUrl=${STRIPE_CANCEL_URL:-ebooking://payment-cancel}
      - Payments__PayPal__ClientId=${PAYPAL_CLIENT_ID:-}
      - Payments__PayPal__ClientSecret=${PAYPAL_CLIENT_SECRET:-}
      - Payments__PayPal__BaseUrl=${PAYPAL_API_BASE_URL:-https://api-m.sandbox.paypal.com}
      - Payments__PayPal__WebhookId=${PAYPAL_WEBHOOK_ID:-}
      - Payments__PayPal__ReturnUrl=${PAYPAL_RETURN_URL:-ebooking://payment-return}
      - Payments__PayPal__CancelUrl=${PAYPAL_CANCEL_URL:-ebooking://payment-cancel}
    ports:
      - "8080:8080"
    volumes:
      - hotel_uploads:/app/uploads
    restart: unless-stopped

volumes:
  mssql_data:
    driver: local
  rabbitmq_data:
    driver: local
  hotel_uploads:
    driver: local
