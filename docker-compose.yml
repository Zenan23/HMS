services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
      cache_from:
        - mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: ebooking-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ebooking-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  api:
    build:
      context: ./backend/eBooking    
      dockerfile: Dockerfile
      cache_from:
        - mcr.microsoft.com/dotnet/sdk:8.0
        - mcr.microsoft.com/dotnet/aspnet:8.0
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: ebooking-api
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Plaćanja/SMTP dolaze iz env.secret (NIJE komitovan — kopiraj env.secret.example i
    # popuni prave vrijednosti, vidi README "Konfiguracija / .env"). Infra tajne (DB lozinka,
    # JWT ključ, RabbitMQ kredencijali) dolaze iz root .env fajla (isto nekomitovan, vidi
    # .env.example) preko ${VAR} supstitucije ispod — nema više hardkodiranih defaulta u
    # ovom fajlu koji bi završili u javnom repou.
    env_file:
      - path: env.secret
        required: true
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=170028;User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=true;TrustServerCertificate=true;MultipleActiveResultSets=true
      - JWT__SecretKey=${JWT_SECRET}
      - JWT__Issuer=eBooking
      - JWT__Audience=eBookingUsers
      - Rabbit__Host=rabbitmq
      - Rabbit__User=${RABBIT_USER}
      - Rabbit__Pass=${RABBIT_PASS}
      # Payments*/Smtp* dolaze iz env.secret — ne stavljati ovdje prazne ${VAR:-}
      # jer bi environment pregazio env_file i ugasio Stripe.
    ports:
      - "8080:8080"
    volumes:
      - hotel_uploads:/app/uploads
    restart: unless-stopped

  # Pomoćni mikroservis: odvojen proces/kontejner koji sluša RabbitMQ i izvršava
  # asinhrone zadatke (potvrda rezervacije nakon plaćanja, kreiranje notifikacija,
  # check-in podsjetnici). Nema HTTP endpoint, ne izlaže port.
  worker:
    build:
      context: ./backend/eBooking
      dockerfile: Worker/Dockerfile
      cache_from:
        - mcr.microsoft.com/dotnet/sdk:8.0
        - mcr.microsoft.com/dotnet/runtime:8.0
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: ebooking-worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - path: env.secret
        required: true
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=170028;User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=true;TrustServerCertificate=true;MultipleActiveResultSets=true
      - Rabbit__Host=rabbitmq
      - Rabbit__User=${RABBIT_USER}
      - Rabbit__Pass=${RABBIT_PASS}
      # Payments*/Smtp* dolaze iz env.secret (isto kao api) — PaymentService je posredna
      # zavisnost BookingService-a pa Worker treba istu konfiguraciju da sastavi DI graf.
    restart: unless-stopped

volumes:
  mssql_data:
    driver: local
  rabbitmq_data:
    driver: local
  hotel_uploads:
    driver: local
